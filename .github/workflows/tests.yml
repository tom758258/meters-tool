name: Tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint:
    name: Ruff and JavaScript syntax
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Check WebUI JavaScript syntax
        run: |
          set -euo pipefail
          mapfile -t files < <(git ls-files 'src/meters_tool_webui/static/*.js')
          if (( ${#files[@]} == 0 )); then
            echo "::error::No tracked WebUI JavaScript files found."
            exit 1
          fi
          for file in "${files[@]}"; do
            node --check "$file"
          done

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install uv
        run: python -m pip install --upgrade uv

      - name: Install package
        run: uv sync --python 3.13 --all-extras --locked --link-mode=copy

      - name: Run Ruff
        run: ./.venv/bin/python -m ruff check src tests

      - name: Run WebUI Node runtime tests
        run: |
          ./.venv/bin/python -c "import shutil; assert shutil.which('node'), 'Node.js is required for WebUI runtime tests'"
          ./.venv/bin/python -m pytest tests/webui/test_webui_api_js.py tests/webui/test_webui_run_form_modules.py -q -p no:cacheprovider -rs

  pytest-linux:
    name: Linux Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        run: python -m pip install --upgrade uv

      - name: Install package
        run: uv sync --python ${{ matrix.python-version }} --all-extras --locked --link-mode=copy

      - name: Build package
        run: ./.venv/bin/python -m build

      - name: Smoke commands
        run: |
          ./.venv/bin/python -c "import meters_tool_core; import meters_tool_cli; import meters_tool_webui"
          ./.venv/bin/meters-tool --help
          ./.venv/bin/meters-tool-webui --help

      - name: Run fast tests
        run: ./.venv/bin/python -m pytest tests -q -p no:cacheprovider --ignore=tests/cli/test_cli_wrappers.py

  pytest-windows:
    name: Windows Python ${{ matrix.python-version }}
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.12"
          - "3.13"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Node.js
        if: matrix.python-version == '3.13'
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install uv
        run: python -m pip install --upgrade uv

      - name: Install package
        run: uv sync --python ${{ matrix.python-version }} --all-extras --locked --link-mode=copy

      - name: Build package
        run: .\.venv\Scripts\python.exe -m build

      - name: Smoke commands
        run: |
          .\.venv\Scripts\python.exe -c "import meters_tool_core; import meters_tool_cli; import meters_tool_webui"
          .\.venv\Scripts\meters-tool.exe --help
          .\.venv\Scripts\meters-tool-webui.exe --help

      - name: Build Desktop directory
        if: matrix.python-version == '3.13'
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\scripts\build_desktop.ps1

      - name: Run fast tests
        run: .\.venv\Scripts\python.exe -m pytest tests -q -p no:cacheprovider --ignore=tests\cli\test_cli_wrappers.py

  wrapper-contracts:
    name: Windows wrapper contracts
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install uv
        run: python -m pip install --upgrade uv

      - name: Install package
        run: uv sync --python 3.13 --all-extras --locked --link-mode=copy

      - name: Run wrapper contract tests
        run: .\.venv\Scripts\python.exe -m pytest tests\cli\test_cli_wrappers.py -q -p no:cacheprovider
